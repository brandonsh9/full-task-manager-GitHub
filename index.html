<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Task Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <script src="js/app.js"></script>
</head>

<body>
    <main>
        <h1>Gestor de tareas</h1>
        <form id="task-form" class="my-form">

            <label class="field">
                <span><span class="req-field">*</span> Title:</span>
                <input type="text" name="title" placeholder="Title" id="title" required />
            </label>

            <label class="field">
                <span>Description:</span>
                <input type="text" name="description" placeholder="Description" id="description" />
            </label>

            <label class="field">
                <span>Release date:</span>
                <input type="date" name="due_date" id="due_date" />
            </label>

            <label class="field cbx-g">
                <span>¿Is completed?</span>
                <input type="checkbox" name="completed" id="completed" />
            </label>

            <label class="field">
                <span><span class="req-field">*</span> User id:</span>
                <input type="number" name="user_id" id="user_id" required value="1" />
            </label>

            <label class="field">
                <span><span class="req-field">*</span> Category id:</span>
                <input type="number" name="category_id" id="category_id" required />
            </label>

            <button type="submit">Enviar</button>
        </form>
        <ul id="task-list"></ul>
        

        <section id="category-section">
            <h2>Categorías</h2>
            <form id="category-form" class="my-form">
                <label class="field">
                    <span><span class="req-field">*</span> Nombre de la categoría:</span>
                    <input type="text" name="name" placeholder="Nombre de la categoría" id="name" required />
                </label>

                <label class="field">
                    <span><span class="req-field">*</span> User id:</span>
                    <input type="number" name="user_id" id="user_id" required />
                </label>

                <button type="submit">Crear Categoría</button>
            </form>
            <ul id="category-list"></ul>
            
        </section>
    </main>
</body>

</html>
